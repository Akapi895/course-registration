basePath: /
definitions:
  controller.classDetailData:
    properties:
      class_code:
        example: INT3401-01
        type: string
      course_code:
        example: INT3401
        type: string
      course_id:
        example: 5
        type: integer
      course_name:
        example: Hệ điều hành
        type: string
      credits:
        example: 3
        type: integer
      enrolled:
        example: 42
        type: integer
      id:
        example: 10
        type: integer
      lecturer_name:
        example: Giảng viên A
        type: string
      max_capacity:
        example: 50
        type: integer
      registration_open:
        example: true
        type: boolean
      schedules:
        items:
          $ref: '#/definitions/controller.scheduleItem'
        type: array
      semester_id:
        example: 2
        type: integer
      status:
        example: active
        type: string
    type: object
  controller.classDetailSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/controller.classDetailData'
      status:
        example: success
        type: string
    type: object
  controller.classItem:
    properties:
      class_code:
        example: INT3401-01
        type: string
      course_code:
        example: INT3401
        type: string
      course_name:
        example: Hệ điều hành
        type: string
      credits:
        example: 3
        type: integer
      enrolled:
        example: 42
        type: integer
      id:
        example: 10
        type: integer
      max_capacity:
        example: 50
        type: integer
      registration_open:
        example: true
        type: boolean
    type: object
  controller.classListData:
    properties:
      classes:
        items:
          $ref: '#/definitions/controller.classItem'
        type: array
    type: object
  controller.classListSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/controller.classListData'
      status:
        example: success
        type: string
    type: object
  controller.emptySuccessResponse:
    properties:
      data:
        type: object
      status:
        example: success
        type: string
    type: object
  controller.failData:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Chưa đăng nhập hoặc phiên không hợp lệ
        type: string
    type: object
  controller.failResponse:
    properties:
      data:
        $ref: '#/definitions/controller.failData'
      status:
        example: fail
        type: string
    type: object
  controller.loginData:
    properties:
      access_token:
        type: string
    type: object
  controller.loginRequest:
    properties:
      password:
        example: DemoUET@123
        type: string
      username:
        example: student001
        type: string
    required:
    - password
    - username
    type: object
  controller.loginSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/controller.loginData'
      status:
        example: success
        type: string
    type: object
  controller.meData:
    properties:
      full_name:
        example: Sinh viên giả lập 001
        type: string
      id:
        example: 7
        type: integer
      role:
        example: student
        type: string
      student_code:
        example: DEMO00001
        type: string
      username:
        example: student001
        type: string
    type: object
  controller.meSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/controller.meData'
      status:
        example: success
        type: string
    type: object
  controller.scheduleItem:
    properties:
      day_of_week:
        example: 2
        type: integer
      end_period:
        example: 3
        type: integer
      room:
        example: A2-301
        type: string
      start_period:
        example: 1
        type: integer
    type: object
  controller.studentData:
    properties:
      faculty:
        example: CNTT
        type: string
      full_name:
        example: Sinh viên giả lập 001
        type: string
      id:
        example: 7
        type: integer
      major:
        example: Khoa học máy tính
        type: string
      student_code:
        example: DEMO00001
        type: string
      username:
        example: student001
        type: string
    type: object
  controller.studentProfileData:
    properties:
      faculty:
        example: CNTT
        type: string
      full_name:
        example: Nguyễn Văn A
        type: string
      id:
        example: 7
        type: integer
      major:
        example: Khoa học máy tính
        type: string
      student_code:
        example: DEMO00001
        type: string
    type: object
  controller.studentProfileSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/controller.studentProfileData'
      status:
        example: success
        type: string
    type: object
  controller.studentSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/controller.studentData'
      status:
        example: success
        type: string
    type: object
  controller.updateStudentRequest:
    properties:
      faculty:
        example: CNTT
        type: string
      full_name:
        example: Nguyễn Văn A
        type: string
      major:
        example: Khoa học máy tính
        type: string
    type: object
info:
  contact: {}
  description: API quản lý và đăng ký học phần (Phase 1). Đăng nhập tại POST /api/auth/login,
    rồi bấm Authorize và nhập "Bearer <access_token>".
  title: Course Registration API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Trả về access JWT và tạo một phiên trong auth_sessions.
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.loginSuccessResponse'
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      summary: Đăng nhập
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Thu hồi phiên của JWT hiện tại. Sau đó JWT này bị từ chối.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.emptySuccessResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Đăng xuất và thu hồi phiên
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.meSuccessResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Thông tin người dùng hiện tại
      tags:
      - auth
  /api/classes:
    get:
      description: Trả về các lớp active của học kỳ hiện tại, tức học kỳ mới nhất
        đã mở đăng ký. Trả về danh sách rỗng khi chưa có học kỳ nào mở đăng ký.
      parameters:
      - description: Lọc theo khoa
        in: query
        name: faculty
        type: string
      - description: Lọc theo ngành
        in: query
        name: major
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.classListSuccessResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Danh sách lớp học phần đang mở
      tags:
      - classes
  /api/classes/{id}:
    get:
      description: Trả về cả lớp đã hủy, với trạng thái status = cancelled.
      parameters:
      - description: ID lớp học phần
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.classDetailSuccessResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Chi tiết lớp học phần
      tags:
      - classes
  /api/students/{id}:
    get:
      description: Sinh viên chỉ xem được tài khoản của chính mình. Admin xem được
        mọi sinh viên.
      parameters:
      - description: ID tài khoản sinh viên
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.studentSuccessResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/controller.failResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Xem thông tin sinh viên
      tags:
      - students
    put:
      consumes:
      - application/json
      description: Thay thế họ tên, khoa và ngành. Sinh viên chỉ sửa được tài khoản
        của chính mình. Admin sửa được mọi sinh viên.
      parameters:
      - description: ID tài khoản sinh viên
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cần cập nhật
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.updateStudentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.studentProfileSuccessResponse'
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/controller.failResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật thông tin sinh viên
      tags:
      - students
securityDefinitions:
  BearerAuth:
    description: 'Nhập đúng dạng "Bearer <access_token>": có chữ Bearer, một khoảng
      trắng, rồi token.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
