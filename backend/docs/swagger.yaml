          schema:
            $ref: '#/definitions/controller.failResponse'
        "401":
          description: UNAUTHORIZED hoặc SESSION_REVOKED
          schema:
            $ref: '#/definitions/controller.failResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/controller.failResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/controller.failResponse'
      security:
      - BearerAuth: []
      summary: Đăng ký một hoặc nhiều lớp học phần
