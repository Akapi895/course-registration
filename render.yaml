# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: course-registration-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: course-registration-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 20m
      - key: SESSION_TTL
        value: 20m
      - key: ADMIN_JWT_TTL
        value: 8h
      - key: LOGIN_COOLDOWN
        value: 20m
      - key: MAX_CREDITS
        value: "26"
      - key: GIN_MODE
        value: release

databases:
  - name: course-registration-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: course_registration
    user: course_app
    ipAllowList: []
